
server.port=8080
spring.application.name=API-GATEWAY
spring.profiles.active=local
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ==========================================
# GATEWAY ROUTING CONFIGURATION
# ==========================================

# Route for User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# Route for Post Service
spring.cloud.gateway.server.webflux.routes[1].id=post-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://POST-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/posts/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=AuthenticationFilter
# Route for Profile Service
spring.cloud.gateway.server.webflux.routes[2].id=profile-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://PROFILE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/profile/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=AuthenticationFilter
# Route for Public Profile Service (Bypasses Authentication Filter)
spring.cloud.gateway.server.webflux.routes[3].id=public-profile-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://PROFILE-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/public/profile/**
# ==========================================
# CENTRALIZED CORS CONFIGURATION
# ==========================================
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

# JWT Secret Configuration
jwt.secret=${JWT_ACCESS_SECRET}